name: ELISE KERNEL
on:
  push:
    branches: [ main, master, lineage-23.2 ]
  pull_request:
    branches: [ main, master, lineage-23.2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev zip python3 rsync dwarves patch

      - name: Setup AOSP Clang Toolchain
        run: |
          set -euo pipefail
          TC_DIR="$(pwd)/tc/clang-498229"
          if [ ! -d "$TC_DIR" ]; then
            GITLAB_HOST="https://gitlab.com"
            TC_PATH="/ThankYouMario/android_prebuilts_clang-standalone"
            git clone --depth=1 -b 17 "${GITLAB_HOST}${TC_PATH}" "$TC_DIR"
          fi
          echo "$TC_DIR/bin" >> $GITHUB_PATH

      - name: Integrate KernelSU (ReSukiSU) into drivers/kernelsu
        run: |
          set -euo pipefail
          echo "Downloading KernelSU setup script from ReSukiSU..."
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh > setup_kernelsu.sh
          chmod +x setup_kernelsu.sh
          echo "Setting up KernelSU in drivers/kernelsu..."
          bash setup_kernelsu.sh
          echo "KernelSU integration completed"
          if [ -d "drivers/kernelsu" ]; then
            echo "drivers/kernelsu directory verified"
            ls -la drivers/kernelsu/ | head -10
          else
            echo "ERROR: drivers/kernelsu not found!"
            exit 1
          fi
          rm -f setup_kernelsu.sh

      - name: Clone NonGKI_Kernel_Build_2nd for SUSFS patches
        run: |
          echo "🔽 Cloning NonGKI_Kernel_Build_2nd repository for SUSFS support..."
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git nongki_build_temp
          if [ -d "nongki_build_temp/Patches" ]; then
            cp -r nongki_build_temp/Patches ./SUSFS_Patches
            echo "✅ SUSFS patches copied successfully"
            ls -la SUSFS_Patches/
          else
            echo "⚠️ Patches directory not found in NonGKI_Kernel_Build_2nd"
          fi
          rm -rf nongki_build_temp

      # REMOVED: Apply ReSukiSU Manual Hooks step
      # Reason: We are using SUSFS Inline Hooks now, so manual C-code editing is unnecessary and conflicting.

      - name: Integrate SUSFS into KernelSU driver
        run: |
          echo "🔧 Integrating SUSFS support into KernelSU..."
          cd drivers/kernelsu
          if grep -q "KSU_SUSFS" Kconfig; then
            echo "✅ SUSFS options already present in Kconfig"
          else
            echo "ℹ️ Adding SUSFS configuration options to Kconfig..."
            cat >> Kconfig << 'EOF'
          config KSU_SUSFS
              bool "KernelSU SUSFS support"
              depends on KSU
              help
                Enable SUSFS (Stealth UserSpace File System) support for KernelSU.

          config KSU_SUSFS_SUS_PATH
              bool "SUSFS path hiding"
              depends on KSU_SUSFS

          config KSU_SUSFS_SUS_MOUNT
              bool "SUSFS mount hiding"
              depends on KSU_SUSFS

          config KSU_SUSFS_SUS_KSTAT
              bool "SUSFS kstat spoofing"
              depends on KSU_SUSFS

          config KSU_SUSFS_SPOOF_UNAME
              bool "SUSFS uname spoofing"
              depends on KSU_SUSFS

          config KSU_SUSFS_ENABLE_LOG
              bool "SUSFS logging"
              depends on KSU_SUSFS

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
              bool "Hide KernelSU/SUSFS symbols"
              depends on KSU_SUSFS

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
              bool "Spoof cmdline/bootconfig"
              depends on KSU_SUSFS

          config KSU_SUSFS_OPEN_REDIRECT
              bool "SUSFS open redirect"
              depends on KSU_SUSFS

          config KSU_SUSFS_SUS_MAP
              bool "SUSFS map hiding"
              depends on KSU_SUSFS
          EOF
            echo "✅ SUSFS Kconfig options added"
          fi
          cd ../..

      - name: Update Makefile for SUSFS
        run: |
          echo "🔧 Updating Makefile for SUSFS compilation support..."
          DRIVER_MAKEFILE="drivers/Makefile"
          if grep -q "kernelsu" "$DRIVER_MAKEFILE"; then
            echo "✅ KernelSU entry already exists in Makefile"
          else
            echo "" >> "$DRIVER_MAKEFILE"
            echo "obj-\$(CONFIG_KSU) += kernelsu/" >> "$DRIVER_MAKEFILE"
            echo "✅ Added KernelSU to Makefile"
          fi
          tail -5 "$DRIVER_MAKEFILE"

      - name: Update Kconfig for KernelSU source
        run: |
          echo "🔧 Updating drivers/Kconfig..."
          DRIVER_KCONFIG="drivers/Kconfig"
          if grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"; then
            echo "✅ KernelSU Kconfig source already exists"
          else
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"
            echo "✅ Added KernelSU Kconfig source"
          fi

      - name: Apply SUSFS 2.1 + ZeroMount patches (Amazeble)
        run: |
          set -euo pipefail
          echo "[+] Cloning Amazeble/SUSFS-NonGKI-Patches..."
          rm -rf /tmp/susfs-nongki
          
          # UNCOMMENTED: Now we actually apply the patches
          git clone --depth=1 https://github.com/Amazeble/SUSFS-NonGKI-Patches /tmp/susfs-nongki
          echo "[+] Making apply_patches.sh executable..."
          chmod +x /tmp/susfs-nongki/apply_patches.sh
          cd /tmp/susfs-nongki
          echo "[+] Applying patches to kernel source..."
          if ! printf 'y\n' | ./apply_patches.sh "$GITHUB_WORKSPACE"; then
            echo "::warning::SUSFS patches failed to apply cleanly. Reject files detected."
            find "$GITHUB_WORKSPACE" -name '*.rej' -print
          fi
          echo "[+] Cleaning up patch artifacts..."
          cd "$GITHUB_WORKSPACE"
          find . -name "*.rej" -delete 2>/dev/null || true
          find . -name "*.orig" -delete 2>/dev/null || true
          rm -rf /tmp/susfs-nongki
          
          # Optional: Run the fixup script if your repo includes one, 
          # otherwise the raw patches should suffice for basic functionality.
          # If you had custom fixes in the commented-out block earlier, 
          # you may need to re-add them here if the base patches fail on your specific 4.14.357 tree.
          
          echo "[+] SUSFS 2.1 + ZeroMount patches applied."

      - name: Create ZeroMount stub header and SUSFS compat stubs
        run: |
          set -euo pipefail
          echo "[+] Creating stub ZeroMount header and SUSFS compat stubs for compilation compatibility..."
          python3 << 'PYEOF'
          from pathlib import Path
          import textwrap

          zm = '''#ifndef _LINUX_ZEROMOUNT_H
          #define _LINUX_ZEROMOUNT_H

          #include <linux/types.h>

          static inline void zeromount_spoof_mmap_metadata(struct inode *inode, dev_t *dev, unsigned long *ino) { }
          static inline int zeromount_is_hidden_path(const char *path) { return 0; }
          static inline struct filename *zeromount_getname_hook(struct filename *name) { return name; }
          static inline int zeromount_is_injected_file(struct inode *inode) { return 0; }
          static inline int zeromount_is_traversal_allowed(struct inode *inode, int mask) { return 1; }
          static inline int zeromount_stat_hook(struct filename *filename) { return 0; }

          #endif
          '''
          Path('include/linux/zeromount.h').write_text(textwrap.dedent(zm))

          susfs_h = Path('include/linux/susfs.h')
          if susfs_h.exists():
              content = susfs_h.read_text()
              additions = []
              
              if 'define SUSFS_IS_INODE_OPEN_REDIRECT' not in content:
                  additions.append('''#ifndef SUSFS_IS_INODE_OPEN_REDIRECT
          #define SUSFS_IS_INODE_OPEN_REDIRECT(inode) (0)
          #endif
          #ifndef SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK
          #define SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK(inode) (0)
          #endif''')

              if 'susfs_check_unicode_bypass' not in content:
                  additions.append('static inline int susfs_check_unicode_bypass(const char __user *uptr, ...) { return 0; }')

              if 'susfs_is_hidden_name' not in content:
                  additions.append('static inline int susfs_is_hidden_name(const char *name, ...) { return 0; }')

              if 'susfs_is_current_zygote_domain' not in content:
                  additions.append('static inline int susfs_is_current_zygote_domain(void) { return 0; }')

              if additions:
                  with open('include/linux/susfs.h', 'a') as f:
                      f.write('\n' + '\n'.join(additions) + '\n')
          PYEOF
          echo "[+] ZeroMount stub header and SUSFS compat stubs created."

      - name: Vendor in rtw88 (RTL8812AU) driver from NetHunter tree
        run: |
          set -euo pipefail
          GIT_HOST="https://github.com"
          DRIVER_PATH="/akabul0us/android_kernel_xiaomi_surya_nethunter.git"
          git clone --depth=1 --branch rebase-2-electric-boogaloo "${GIT_HOST}${DRIVER_PATH}" /tmp/nethunter
          mkdir -p drivers/net/wireless/realtek
          cp -r /tmp/nethunter/drivers/net/wireless/realtek/rtw88 drivers/net/wireless/realtek/rtw88
          rm -rf /tmp/nethunter
          find drivers/net/wireless/realtek/rtw88 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/NL80211_SCAN_FLAG_RANDOM_SN/NL80211_SCAN_FLAG_RANDOM_ADDR/g' {} +
          find drivers/net/wireless/realtek/rtw88 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/RX_FLAG_NO_PSDU/0/g' {} +
          if grep -r 'NL80211_SCAN_FLAG_RANDOM_SN' drivers/net/wireless/realtek/rtw88 > /dev/null; then
            echo "ERROR: SN NOT PATCHED"
            exit 1
          else
            echo "SN PATCHED OK"
          fi
          if grep -r 'RX_FLAG_NO_PSDU' drivers/net/wireless/realtek/rtw88 > /dev/null; then
            echo "ERROR: PSDU NOT PATCHED"
            exit 1
          else
            echo "PSDU PATCHED OK"
          fi
          grep -q 'realtek/rtw88/Kconfig' drivers/net/wireless/realtek/Kconfig || \
            sed -i '/source "drivers\/net\/wireless\/realtek\/rtl8xxxu\/Kconfig"/a source "drivers/net/wireless/realtek/rtw88/Kconfig"' drivers/net/wireless/realtek/Kconfig
          grep -q 'CONFIG_RTW88' drivers/net/wireless/realtek/Makefile || \
            echo 'obj-$(CONFIG_RTW88) += rtw88/' >> drivers/net/wireless/realtek/Makefile

      - name: Integrate NoMount into Kernel Source
        run: |
          set -euo pipefail
          echo "Integrating NoMount (dev branch) into kernel source..."
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s dev
          echo "NoMount integration completed successfully!"

      - name: Generate and Force Feature Defconfig
        run: |
          set -euo pipefail
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 surya_defconfig
          
          echo "=== Enabling KernelSU (ReSukiSU) ==="
          ./scripts/config --file out/.config --enable CONFIG_KSU
          
          # CRITICAL CHANGE: Disable Manual Hook, Enable SUSFS/Inline
          ./scripts/config --file out/.config --disable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --file out/.config --disable CONFIG_KSU_KPROBES_HOOK
          
          echo "=== Enabling SusFS v2.3.0 Features (Inline Mode) ==="
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          
          echo "=== Disabling Incompatible/Optional SusFS Features ==="
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file out/.config --disable CONFIG_KSU_SUSFS_SUS_MAP
          
          echo "=== Disabling ZeroMount (stub only, no driver) ==="
          ./scripts/config --file out/.config --disable CONFIG_ZEROMOUNT
          
          echo "=== Enabling Other Features ==="
          ./scripts/config --file out/.config --enable CONFIG_MODULES
          ./scripts/config --file out/.config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --file out/.config --enable CONFIG_KPM
          ./scripts/config --file out/.config --enable CONFIG_EXT4_FS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          ./scripts/config --file out/.config --enable CONFIG_PACKET
          
          echo "=== USB and Bluetooth as Modules ==="
          ./scripts/config --file out/.config --module CONFIG_USB_GADGET
          ./scripts/config --file out/.config --module CONFIG_USB_CONFIGFS
          ./scripts/config --file out/.config --module CONFIG_USB_LIBCOMPOSITE
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_FS
          ./scripts/config --file out/.config --module CONFIG_USB_F_FS
          
          echo "=== Finalize config (MUST be the LAST command of this step) ==="
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E "CONFIG_USB_CONFIGFS_F_FS|CONFIG_USB_F_FS" out/.config || true

      - name: Build Kernel
        run: |
          set -euo pipefail
          echo "=== Building kernel with AOSP Clang ==="
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-
          echo "=== Build finished, listing outputs ==="
          ls -la out/arch/arm64/boot/

      - name: Package Kernel into Zip
        run: |
          set -euo pipefail
          BUILD_DATE="$(date +'%Y%m%d')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          ZIP_NAME="ELISE-Kernel-surya-${BUILD_DATE}-${SHORT_SHA}"
          STAGE="dist/${ZIP_NAME}"
          mkdir -p "${STAGE}/dtbs"
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz "${STAGE}/"
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image "${STAGE}/"
          else
            echo "::error::No kernel image found!"
            exit 1
          fi
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} "${STAGE}/dtbs/" \; || true
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img "${STAGE}/" || true
          if find out/ -name "*.ko" | grep -q .; then
            mkdir -p "${STAGE}/modules"
            find out/ -name "*.ko" -exec cp {} "${STAGE}/modules/" \; || true
          fi
          {
            echo "Kernel   : ELISE KERNEL"
            echo "Device   : xiaomi surya"
            echo "Date     : ${BUILD_DATE}"
            echo "Commit   : ${SHORT_SHA}"
            echo "Toolchain: AOSP clang-498229"
            echo "Features : ReSukiSU (SUSFS Inline) + SUSFS v2.3.0 + NoMount"
          } > "${STAGE}/BUILD_INFO.txt"
          (cd dist && zip -r9 "${ZIP_NAME}.zip" "${ZIP_NAME}")
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -la dist/

      - name: Upload Kernel Zip as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}.zip
        if-no-files-found: error
        retention-days: 30
